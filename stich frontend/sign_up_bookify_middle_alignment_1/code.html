<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md" style="background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuDgQslDlRqDzHT3BObmrYcBfZCeDmhCrGbWc6w2q5qOoJcPPpeM10aWtk5of4yIOtWsPSE30Hl1m8A3CF_zyHVUABFgGW56mn1VEkqCBnoXdBjBzmbuNJwzdM_m3B9t-VifPdkw_kbhnT1GcTxjFuPAu3qXRNBRFCHNQ-c0KuVaKzL1XTO1f21Gg24tEsZM81Tz90lu5HDtHqLvbM3JE5LyNqESaMFYJ6sF67TEas_1BMZdvC6lfW-CT2VUrImM00U56Q&quot;); background-size: cover; background-position: center center; background-attachment: fixed;">
<!-- Split Screen Layout -->
<main class="flex-grow flex w-full h-screen overflow-hidden items-center justify-center">
<!-- Left Side: Form Canvas -->
<section class="max-w-md w-full mx-auto bg-surface/80 backdrop-blur-xl p-8 md:p-12 rounded-xl shadow-[0_4px_20px_rgba(26,43,75,0.08)] ghost-border z-10">
<div class="max-w-md w-full space-y-12">
<!-- Header -->
<div class="space-y-4">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary tracking-tighter">Join Bookify</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Enter your credentials to access the digital press and research archives.</p>
</div>
<!-- Registration Form -->
<form action="#" class="space-y-8" method="POST">
<div class="space-y-6">
<!-- Full Name -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 transition-colors group-focus-within:text-primary" for="fullName">Full Name</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-on-surface transition-colors placeholder-on-surface-variant/50" id="fullName" name="fullName" placeholder="e.g. Jane Doe" required="" type="text">
</div>
<!-- University Email -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 transition-colors group-focus-within:text-primary" for="email">University Email</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-on-surface transition-colors placeholder-on-surface-variant/50" id="email" name="email" placeholder="name@university.edu" required="" type="email">
</div>
<!-- Student ID -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 transition-colors group-focus-within:text-primary" for="studentId">Student ID</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-on-surface transition-colors placeholder-on-surface-variant/50" id="studentId" name="studentId" placeholder="Enter your ID number" required="" type="text">
</div>
<!-- Password -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 transition-colors group-focus-within:text-primary" for="password">Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-on-surface transition-colors placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Actions -->
<div class="pt-4 space-y-6">
<button class="w-full bg-primary text-on-primary font-label-caps text-label-caps py-4 rounded hover:bg-secondary transition-colors duration-300 shadow-[0_4px_20px_rgba(26,43,75,0.08)] flex justify-center items-center gap-2" type="submit">
                            Create Account
                            <span class="material-symbols-outlined text-[18px]" data-weight="fill">arrow_forward</span>
</button>
<div class="text-center">
<a class="inline-flex items-center gap-2 font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors pb-1 border-b-2 border-transparent hover:border-tertiary-fixed-dim" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                                Back to Login
                            </a>
</div>
</div>
</form>
</div>

<!-- Right Side: Immersive Image -->
