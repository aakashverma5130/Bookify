<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center p-margin-mobile md:p-margin-desktop antialiased font-body-lg text-body-lg">
<div class="w-full max-w-md mx-auto">
<!-- Header Section -->
<header class="mb-10 text-center md:text-left">
<div class="mb-8">
<span class="font-display-lg text-display-lg font-bold text-primary tracking-tight">Bookify</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-background mb-3 md:font-display-lg md:text-display-lg">Welcome back.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sign in to continue to your library account.</p>
</header>
<!-- Form Section -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-8 md:p-10 shadow-[0_4px_20px_rgba(26,43,75,0.04)]">
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-2 uppercase tracking-wide" for="student-id">Student ID</label>
<input class="w-full h-12 px-4 rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg focus:border-primary focus:ring-2 focus:ring-secondary/20 outline-none transition-all placeholder:text-outline" id="student-id" name="student-id" placeholder="Enter your student ID" required="" type="text">
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-2 uppercase tracking-wide" for="password">Password</label>
<input class="w-full h-12 px-4 rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg focus:border-primary focus:ring-2 focus:ring-secondary/20 outline-none transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<div class="pt-4 space-y-4">
<button class="w-full h-12 flex justify-center items-center rounded-DEFAULT bg-primary text-on-primary font-title-sm text-title-sm border border-primary hover:opacity-90 transition-opacity" type="submit">
                        Sign In
                    </button>
<button class="w-full h-12 flex justify-center items-center rounded-DEFAULT bg-transparent text-primary font-title-sm text-title-sm hover:text-primary-container transition-colors" type="button">
                        Forgot password?
                    </button>
</div>
</form>
</div>
</div>
